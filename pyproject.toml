# pyproject.toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oktober"
version = "0.1.0"
description = "A viewer and analysis tool for MRC files in cryo-EM/ET"
readme = "README.md"
authors = [
    { name = "Tianfang Zhao", email = "zhaotianfang2010@163.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent"
]
keywords = ["cryo-em", "cryo-et", "visualization"]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "pyqt5>=5.15.0",
    "mrcfile>=1.3.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "flake8",
    "black",
    "jupyter"
]
doc = [
    "sphinx",
    "sphinx-rtd-theme"
]

[project.urls]
Homepage = "https://github.com/yourusername/oktober"
Repository = "https://github.com/yourusername/oktober"
Issues = "https://github.com/yourusername/oktober/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["oktober*"]
